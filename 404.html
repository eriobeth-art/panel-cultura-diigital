<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d4f87">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Panel docente | Cultura Digital | EPOANT</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5fb;font-family:Arial,Helvetica,sans-serif}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#eef5fb;color:#123e68;z-index:2;text-align:center;padding:24px}
    .card{background:white;border:1px solid #cfe0ef;border-radius:18px;padding:28px 34px;box-shadow:0 10px 30px rgba(20,68,105,.12);max-width:520px}
    .spinner{width:34px;height:34px;border:4px solid #dceaf5;border-top-color:#0d5f9c;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
    iframe{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:white}
  </style>
</head>
<body>
  <div id="loading"><div class="card"><div class="spinner"></div><strong>Abriendo panel docente…</strong><div style="margin-top:8px;font-size:14px">Cultura Digital · EPOANT</div></div></div>
  <iframe id="app" title="Panel docente Cultura Digital EPOANT" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    (function(){
      const APP_URL='https://script.google.com/macros/s/AKfycby3-FxItPy1snFc9yOOGfaH92D_JQUf-TxV4Z27KPYKFKJ8fE35aKddGHhD7QtLOWR2/exec';
      const dest=new URL(APP_URL);
      dest.searchParams.set('admin','1');
      const frame=document.getElementById('app');
      frame.addEventListener('load',()=>{document.getElementById('loading').style.display='none';});
      frame.src=dest.toString();
    })();
  </script>
</body>
</html>
