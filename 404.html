<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d4f87">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Panel docente | Cultura Digital | EPOANT</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef5fb;color:#17324d}
    body{display:grid;place-items:center;padding:24px}
    .card{width:min(560px,100%);background:#fff;border:1px solid #cfe0ef;border-radius:20px;padding:28px;box-shadow:0 12px 36px rgba(20,68,105,.14);text-align:center}
    .spinner{width:38px;height:38px;border:4px solid #dceaf5;border-top-color:#0d5f9c;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
    h1{font-size:22px;margin:0 0 8px}.muted{color:#63758a;line-height:1.45}.btn{display:inline-block;margin-top:18px;padding:12px 18px;border-radius:12px;background:#175b96;color:#fff;text-decoration:none;font-weight:800}
    .small{font-size:12px;margin-top:14px;color:#74879a;word-break:break-all}
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Abriendo panel docente…</h1>
    <div class="muted">Cultura Digital · Primero 2 · EPOANT</div>
    <a id="openBtn" class="btn" href="#">Abrir panel ahora</a>
    <div class="small">Acceso administrativo seguro mediante Google Apps Script.</div>
  </main>
  <script>
    (function(){
      const APP='https://script.google.com/macros/s/AKfycby3-FxItPy1snFc9yOOGfaH92D_JQUf-TxV4Z27KPYKFKJ8fE35aKddGHhD7QtLOWR2/exec?admin=1';
      document.getElementById('openBtn').href=APP;
      // Redirección de nivel superior: evita bloqueos y pantallas blancas de iframe.
      setTimeout(function(){ window.location.replace(APP); }, 250);
    })();
  </script>
</body>
</html>
